---
name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

# Lazarus/FPC used by every build: change these to switch versions
env:
  LAZARUS_WIN64_URL: https://sourceforge.net/projects/lazarus-snapshots/files/Window%2064/2026-10-08%20Lazarus-5.0RC1%20with%20FPC-3.2.4RC2/lazarus-5.0RC1-fpc-3.2.4-rc2-win64.exe/download
  LAZARUS_LINUX_URL: https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%205.0RC1
  LAZARUS_LINUX_DEBS: fpc-laz_3.2.2-210709_amd64.deb fpc-src_3.2.2-210709_amd64.deb lazarus-project_5.0.0-0_amd64.deb
  LAZARUS_SOURCE_TAG: lazarus_5_0_RC1
  # FPC main only bootstraps from FPC 3.2.2 (Windows ARM64 cross compiler)
  FPC_BOOTSTRAP_WIN64_URL: https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win64.exe/download
  # Inno Setup for the Windows installer (6.5 or later: ArchiveExtraction)
  INNOSETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe
  FPC_MACOS_URL: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%205.0RC1/fpc-3.2.4rc2.intelarm64-macosx.dmg/download

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.version.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from the project (Project Options > Version Info)
      - name: Read version from tero.lpi
        id: version
        run: |
          lpi=TeroSubtitler/src/tero.lpi
          nr() { grep -o "<$1 Value=\"[0-9]*\"" "$lpi" | head -1 | grep -o '[0-9][0-9]*' || echo 0; }
          version="$(nr MajorVersionNr).$(nr MinorVersionNr).$(nr RevisionNr).$(nr BuildNr)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=TeroSubtitler-$version-nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Compare HEAD with current nightly tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha=$(gh api "repos/${{ github.repository }}/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$tag_sha" != "${{ github.sha }}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    # a timeout shows up as "The operation was canceled"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure GitHub HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --remote --recursive use/UW_BlurayPGSParser
          git submodule update --init --remote --recursive use/UW_MPVPlayer

      - name: Set nightly version
        id: ver
        shell: bash
        run: echo "name=${{ needs.check.outputs.base }}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # SourceForge downloads are kept in the Actions cache, so a version is fetched once
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dl
          key: dl-${{ env.LAZARUS_WIN64_URL }}

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\dl" | Out-Null
          $exe = "$env:RUNNER_TEMP\dl\lazarus-setup.exe"
          if (-not (Test-Path $exe)) {
            curl.exe -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o $exe $env:LAZARUS_WIN64_URL
            if ($LastExitCode -ne 0) { Remove-Item $exe -ErrorAction SilentlyContinue; exit $LastExitCode }
          }
          Start-Process -FilePath $exe -ArgumentList '/SP-','/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES' -Wait -NoNewWindow
          $fpcbin = (Get-ChildItem 'C:\Lazarus\fpc\*\bin\x86_64-win64' -Directory | Select-Object -First 1).FullName
          $env:PATH += ";C:\Lazarus;$fpcbin"
          lazbuild --version
          # Packages and internal dependencies, as in make.ps1
          $env:INSTANTFPCOPTIONS = '-FuC:\Lazarus\components\lazutils'
          instantfpc '.github/workflows/make.pas' build
          if ($LastExitCode -ne 0) { exit $LastExitCode }
          lazbuild --build-all --build-mode=Release --no-write-project TeroSubtitler/src/tero.lpi
          if ($LastExitCode -ne 0) { exit $LastExitCode }

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/${{ steps.ver.outputs.name }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bin = 'TeroSubtitler/bin'
          foreach ($d in 'CustomFormat','Dictionaries','Icons','Languages','OCR') {
            Copy-Item -Recurse "$bin/$d" "$out/$d"
          }
          Copy-Item -Recurse "$bin/Shortcuts" "$out/Shortcuts"
          foreach ($f in 'tero.cfs','tero.exe') {
            Copy-Item "$bin/$f" "$out/$f"
          }
          # libmpv (UW_libmpv) and OpenSSL 3 + Hunspell (UW_TSLibs), the latest releases
          $libs = "$env:RUNNER_TEMP\libs"
          New-Item -ItemType Directory -Force -Path $libs | Out-Null
          foreach ($u in 'UW_libmpv/releases/latest/download/libmpv2_win64.zip','UW_TSLibs/releases/latest/download/tslibs_win64.zip') {
            $zip = "$libs\" + (Split-Path $u -Leaf)
            curl.exe -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o $zip "https://github.com/URUWorks/$u"
            if ($LastExitCode -ne 0) { exit $LastExitCode }
            Expand-Archive -Force $zip -DestinationPath "$libs\x"
          }
          Get-ChildItem "$libs\x" -Recurse -Filter *.dll | Copy-Item -Destination $out
          foreach ($f in 'libmpv-2.dll','libssl-3-x64.dll','libcrypto-3-x64.dll','libhunspellx64.dll') {
            if (-not (Test-Path "$out/$f")) { Write-Error "$f missing" }
          }
          Get-ChildItem $out -Filter *.dll | Format-Table Name, Length
          Compress-Archive -Path $out -DestinationPath "dist/${{ steps.ver.outputs.name }}.zip"

          # Windows 7/8.1: the same tero.exe and OpenSSL 3 (checked for no Win8+ imports),
          # with the last libmpv that runs there (UW_libmpv, release "frozen")
          $legacy = "dist/${{ steps.ver.outputs.name }}-legacy"
          Copy-Item -Recurse $out $legacy
          $zip = "$libs\libmpv2_win64_legacy.zip"
          curl.exe -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o $zip "https://github.com/URUWorks/UW_libmpv/releases/download/frozen/libmpv2_win64_legacy.zip"
          if ($LastExitCode -ne 0) { exit $LastExitCode }
          Expand-Archive -Force $zip -DestinationPath "$libs\legacy"
          Get-ChildItem "$libs\legacy" -Recurse -Filter *.dll | Copy-Item -Destination $legacy -Force
          Get-ChildItem $legacy -Filter *.dll | Format-Table Name, Length
          Compress-Archive -Path $legacy -DestinationPath "$legacy.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          retention-days: 7

  # Windows ARM64, experimental: FPC 3.2.4 has no aarch64-win64 target, so this
  # builds an FPC main cross compiler and Lazarus main on x64. The release doesn't
  # wait for it; its zip is added afterwards, only if it starts on ARM64 Windows.
  build-winarm64:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      NAME: ${{ needs.check.outputs.base }}-winarm64
      FPCMAIN: C:\fpcmain
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure GitHub HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --remote --recursive use/UW_BlurayPGSParser
          git submodule update --init --remote --recursive use/UW_MPVPlayer

      # Lazarus 4.8 for its FPC 3.2.2 (the only starting compiler FPC main accepts) and make
      # SourceForge downloads are kept in the Actions cache, so a version is fetched once
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dl
          key: dl-${{ env.FPC_BOOTSTRAP_WIN64_URL }}

      - name: Install FPC 3.2.2 (starting compiler)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\dl" | Out-Null
          $exe = "$env:RUNNER_TEMP\dl\lazarus-setup.exe"
          if (-not (Test-Path $exe)) {
            curl.exe -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o $exe $env:FPC_BOOTSTRAP_WIN64_URL
            if ($LastExitCode -ne 0) { Remove-Item $exe -ErrorAction SilentlyContinue; exit $LastExitCode }
          }
          Start-Process -FilePath $exe -ArgumentList '/SP-','/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES' -Wait -NoNewWindow
          $fpcbin = (Get-ChildItem 'C:\Lazarus\fpc\*\bin\x86_64-win64' -Directory | Select-Object -First 1).FullName
          "FPCBIN=$fpcbin" >> $env:GITHUB_ENV

      - name: Build FPC main (aarch64-win64 cross compiler)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          $env:PATH = "$env:FPCBIN;$env:PATH"
          $src = "$env:RUNNER_TEMP\fpcsrc"
          git clone -q --depth 1 -c core.autocrlf=false https://gitlab.com/freepascal.org/fpc/source.git $src
          if ($LastExitCode -ne 0) { exit $LastExitCode }
          git -C $src log -1 --format='FPC main %h %cs'
          # Internal linker fix for IMAGE_REL_ARM64_PAGEOFFSET_12L (FPC issue #42048):
          # without it LDR page offsets are not scaled and tero.exe crashes at start-up.
          # Skipped once FPC main has it (or anything else in the patch changed).
          # with LF line endings, as the sources (the checkout may have made it CRLF)
          $patch = "$env:RUNNER_TEMP\fpc.patch"
          $text = Get-Content -Raw "$env:GITHUB_WORKSPACE\.github\workflows\fpc-aarch64-win64-pageoffset12l.patch"
          [IO.File]::WriteAllText($patch, $text.Replace("`r`n", "`n"))
          git -C $src apply --check $patch
          if ($LastExitCode -eq 0) { git -C $src apply $patch; 'FPC patch applied' } else { 'FPC patch not applied' }
          Set-Location $src
          make clean all install OS_TARGET=win64 CPU_TARGET=x86_64 PP="$env:FPCBIN\ppcx64.exe" INSTALL_PREFIX=$env:FPCMAIN
          if ($LastExitCode -ne 0) { exit $LastExitCode }
          $native = "$env:FPCMAIN\bin\x86_64-win64\ppcx64.exe"
          # aarch64-win64 assembles with clang (LLVM is preinstalled on the runner);
          # the prefixed name also makes clang default to that target
          $clang = (Get-Command clang.exe -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = 'C:\Program Files\LLVM\bin\clang.exe' }
          Copy-Item $clang "$env:FPCMAIN\bin\x86_64-win64\aarch64-win64-clang.exe"
          $env:PATH = "$env:FPCMAIN\bin\x86_64-win64;$env:PATH"
          & aarch64-win64-clang.exe --version
          make clean crossall crossinstall OS_TARGET=win64 CPU_TARGET=aarch64 PP=$native INSTALL_PREFIX=$env:FPCMAIN
          if ($LastExitCode -ne 0) { exit $LastExitCode }
          $bin = "$env:FPCMAIN\bin\x86_64-win64"
          # unit paths from where install really put them (<root>\rtl\system.ppu,
          # <root>\fcl-db\db.ppu...), with the target as $fpctarget
          $found = @(Get-ChildItem $env:FPCMAIN -Recurse -Include system.ppu,db.ppu -File)
          $found | ForEach-Object { $_.FullName }
          if (-not ($found | Where-Object Name -eq 'db.ppu')) {
            Get-ChildItem "$env:FPCMAIN" -Recurse -Directory -Depth 3 | ForEach-Object { $_.FullName }
            Write-Error 'FPC main packages (db.ppu) were not installed'
          }
          $cfg = foreach ($f in $found) {
            $root = Split-Path (Split-Path $f.FullName)
            $t = Split-Path $root -Leaf
            $root = $root.Substring(0, $root.Length - $t.Length) + '$fpctarget'
            "-Fu$root\*"
            "-Fu$root\rtl"
          }
          # -Xm: linker map, to turn a crash offset into a routine name
          @($cfg | Sort-Object -Unique) + '-Xm' | Set-Content "$bin\fpc.cfg"
          Get-Content "$bin\fpc.cfg"
          & "$bin\fpc.exe" -iV
          & "$bin\ppcrossa64.exe" -iTP -iTO

      - name: Build Lazarus main (lazbuild)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          $env:PATH = "$env:FPCMAIN\bin\x86_64-win64;$env:FPCBIN;$env:PATH"
          $laz = "$env:RUNNER_TEMP\lazmain"
          git clone -q --depth 1 https://gitlab.com/freepascal.org/lazarus/lazarus.git $laz
          if ($LastExitCode -ne 0) { exit $LastExitCode }
          git -C $laz log -1 --format='Lazarus main %h %cs'
          make -C $laz lazbuild FPC="$env:FPCMAIN\bin\x86_64-win64\fpc.exe"
          if ($LastExitCode -ne 0) { exit $LastExitCode }
          "LAZMAIN=$laz" >> $env:GITHUB_ENV
          & "$laz\lazbuild.exe" --version

      - name: Install packages
        shell: bash
        run: |
          set -euo pipefail
          lb() { "$LAZMAIN/lazbuild.exe" --pcp="$RUNNER_TEMP/pcp" --lazarusdir="$LAZMAIN" \
            --compiler="$FPCMAIN/bin/x86_64-win64/fpc.exe" "$@"; }
          opm="$RUNNER_TEMP/opm"
          for p in BGRABitmap FPSpreadsheet ATFlatControls EncConv ATSynEdit; do
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o "$RUNNER_TEMP/$p.zip" "https://packages.lazarus-ide.org/$p.zip"
            mkdir -p "$opm/$p"
            unzip -q -o "$RUNNER_TEMP/$p.zip" -d "$opm/$p" -x "*/test_files/*"
          done
          find "$opm" use TeroSubtitler/common TeroSubtitler/subtitleapi TeroSubtitler/controls \
            -name '*.lpk' | grep -Ev '(cocoa|gtk|qt|x11|_template)' | while read -r lpk; do
              lb --add-package-link "$lpk"
          done

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          "$LAZMAIN/lazbuild.exe" --pcp="$RUNNER_TEMP/pcp" --lazarusdir="$LAZMAIN" \
            --compiler="$FPCMAIN/bin/x86_64-win64/fpc.exe" \
            --build-all --recursive --build-mode=Release --cpu=aarch64 --os=win64 --widgetset=win32 \
            --no-write-project TeroSubtitler/src/tero.lpi

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          $bin = 'TeroSubtitler/bin'
          # PE machine type of tero.exe must be ARM64 (0xAA64)
          $b = [IO.File]::ReadAllBytes("$bin/tero.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $m = [BitConverter]::ToUInt16($b, $pe + 4)
          "tero.exe machine: 0x{0:X4}" -f $m
          if ($m -ne 0xAA64) { Write-Error 'tero.exe is not ARM64' }
          $out = "dist/$env:NAME"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($d in 'CustomFormat','Dictionaries','Icons','Languages','OCR','Shortcuts') {
            Copy-Item -Recurse "$bin/$d" "$out/$d"
          }
          foreach ($f in 'tero.cfs','tero.exe') { Copy-Item "$bin/$f" "$out/$f" }
          $libs = "$env:RUNNER_TEMP\libs"
          New-Item -ItemType Directory -Force -Path $libs | Out-Null
          foreach ($u in 'UW_libmpv/releases/latest/download/libmpv2_winarm64.zip','UW_TSLibs/releases/latest/download/tslibs_winarm64.zip') {
            $zip = "$libs\" + (Split-Path $u -Leaf)
            curl.exe -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o $zip "https://github.com/URUWorks/$u"
            if ($LastExitCode -ne 0) { exit $LastExitCode }
            Expand-Archive -Force $zip -DestinationPath "$libs\x"
          }
          Get-ChildItem "$libs\x" -Recurse -Filter *.dll | Copy-Item -Destination $out
          foreach ($f in 'libmpv-2.dll','libssl-3-arm64.dll','libcrypto-3-arm64.dll','libhunspellx64.dll') {
            if (-not (Test-Path "$out/$f")) { Write-Error "$f missing" }
          }
          Get-ChildItem $out -Filter *.dll | Format-Table Name, Length
          Compress-Archive -Path $out -DestinationPath "dist/$env:NAME.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winarm64
          path: dist/*.zip
          retention-days: 7

      - name: Upload linker map
        uses: actions/upload-artifact@v4
        with:
          name: winarm64-map
          path: TeroSubtitler/bin/tero.map
          if-no-files-found: warn
          retention-days: 7

  # Tero for ARM64 starts on a real ARM64 Windows (it should stay open; closes it after 20 s)
  test-winarm64:
    needs: build-winarm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winarm64
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: winarm64-map
          path: map
      - name: Start tero.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          Expand-Archive (Get-ChildItem *.zip | Select-Object -First 1).FullName -DestinationPath t
          $exe = (Get-ChildItem t -Recurse -Filter tero.exe | Select-Object -First 1).FullName
          $p = Start-Process $exe -PassThru
          Start-Sleep 20
          if ($p.HasExited) {
            # crash details: faulting module and offset from the Application log
            Start-Sleep 5
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in 'Application Error','Windows Error Reporting' } |
              ForEach-Object { '----- ' + $_.ProviderName; $_.Message } | Tee-Object -Variable ev
            # fault offset -> nearest symbols in the linker map
            $m = [regex]::Match(($ev -join "`n"), 'Fault offset: 0x([0-9a-fA-F]+)')
            $map = Get-ChildItem map -Recurse -Filter *.map -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($m.Success -and $map) {
              $b = [IO.File]::ReadAllBytes($exe)
              $pe = [BitConverter]::ToInt32($b, 0x3C)
              $base = [BitConverter]::ToUInt64($b, $pe + 24 + 24)
              $va = $base + [Convert]::ToUInt64($m.Groups[1].Value, 16)
              "image base 0x{0:X}, fault address 0x{1:X}" -f $base, $va
              $syms = foreach ($l in [IO.File]::ReadLines($map.FullName)) {
                if ($l -match '^\s+0x([0-9a-fA-F]{8,16})\s+(\S+)\s*$') {
                  [pscustomobject]@{ A = [Convert]::ToUInt64($Matches[1], 16); N = $Matches[2] }
                }
              }
              $syms | Where-Object A -le $va | Sort-Object A | Select-Object -Last 3 |
                ForEach-Object { "0x{0:X}  {1}  (+0x{2:X})" -f $_.A, $_.N, ($va - $_.A) }
            }
            Write-Error ("tero.exe exited with code 0x{0:X8}" -f $p.ExitCode)
          }
          "tero.exe running, pid $($p.Id)"
          Stop-Process $p

  build-linux:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    # ARM64 is experimental: if it fails, the release goes out without it
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        widgetset: [gtk2, gtk3, qt5, qt6]

    env:
      NAME: ${{ needs.check.outputs.base }}-linux-${{ matrix.arch }}-${{ matrix.widgetset }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure GitHub HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --remote --recursive use/UW_BlurayPGSParser
          git submodule update --init --remote --recursive use/UW_MPVPlayer

      - name: Cache downloads
        if: matrix.arch == 'x86_64'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dl
          key: dl-${{ env.LAZARUS_LINUX_URL }}-${{ env.LAZARUS_LINUX_DEBS }}

      # Official Lazarus debs (see LAZARUS_LINUX_* at the top)
      - name: Install Lazarus
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          for deb in $LAZARUS_LINUX_DEBS; do
            [[ -f "$deb" ]] || curl -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o "$deb" "$LAZARUS_LINUX_URL/$deb/download" || { rm -f "$deb"; exit 1; }
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./fpc-laz_*.deb ./fpc-src_*.deb ./lazarus-project_*.deb \
            libgtk2.0-dev libgtk-3-dev libgl-dev libmpv-dev patchelf
          lazdir=$(dirname "$(readlink -f "$(command -v lazbuild)")")
          sudo chown -R "$USER" "$lazdir"
          echo "LAZDIR=$lazdir" >> "$GITHUB_ENV"
          lazbuild --version

      # ARM64: the Lazarus debs are amd64 only, so Ubuntu's FPC 3.2.2 (arm64) and
      # lazbuild built from the Lazarus sources (LAZARUS_SOURCE_TAG), as on macOS
      - name: Install Lazarus (ARM64)
        if: matrix.arch == 'aarch64'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fpc fpc-source libhunspell-1.7-0 libgtk2.0-dev libgtk-3-dev libgl-dev libmpv-dev patchelf
          fpc -iV
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o "$RUNNER_TEMP/lazarus.tar.gz" \
            "https://gitlab.com/freepascal.org/lazarus/lazarus/-/archive/$LAZARUS_SOURCE_TAG/lazarus-$LAZARUS_SOURCE_TAG.tar.gz"
          lazdir="$HOME/lazarus"
          mkdir -p "$lazdir"
          tar -xzf "$RUNNER_TEMP/lazarus.tar.gz" -C "$lazdir" --strip-components=1
          make -C "$lazdir" lazbuild
          echo "$lazdir" >> "$GITHUB_PATH"
          echo "LAZDIR=$lazdir" >> "$GITHUB_ENV"
          "$lazdir/lazbuild" --version

      # Qt bindings from the installed Lazarus (Ubuntu has no libqt6pas, and its libqt5pas is older)
      - name: Build Qt bindings
        if: startsWith(matrix.widgetset, 'qt')
        run: |
          set -euo pipefail
          if [[ "${{ matrix.widgetset }}" == qt5 ]]; then
            sudo apt-get install -y -qq qtbase5-dev qt5-qmake libqt5x11extras5-dev
            qmake=qmake
          else
            sudo apt-get install -y -qq qt6-base-dev qmake6
            qmake=qmake6
          fi
          cd "$LAZDIR/lcl/interfaces/${{ matrix.widgetset }}/cbindings"
          $qmake
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          ls -l /usr/lib/x86_64-linux-gnu/libQt*Pas.so* /usr/lib/libQt*Pas.so* 2>/dev/null || true

      - name: Install packages
        run: |
          set -euo pipefail
          opm="$HOME/.lazarus/onlinepackagemanager/packages"
          for p in BGRABitmap FPSpreadsheet ATFlatControls EncConv ATSynEdit; do
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o "$RUNNER_TEMP/$p.zip" "https://packages.lazarus-ide.org/$p.zip"
            mkdir -p "$opm/$p"
            unzip -q -o "$RUNNER_TEMP/$p.zip" -d "$opm/$p" -x "*/test_files/*"
          done
          find "$opm" use TeroSubtitler/common TeroSubtitler/subtitleapi TeroSubtitler/controls \
            -name '*.lpk' | grep -Ev '(cocoa|gdi|_template)' | while read -r lpk; do
              lazbuild --lazarusdir="$LAZDIR" --add-package-link "$lpk"
          done

      # ATSynEdit needs the LCL gtk2 interface built with WITH_GTK2_IM;
      # set it globally so the recursive build recompiles LCL with it
      - name: Enable GTK2 input method
        if: matrix.widgetset == 'gtk2'
        run: echo '-dWITH_GTK2_IM' | sudo tee -a /etc/fpc.cfg

      - name: Build
        run: |
          set -euo pipefail
          lazbuild --lazarusdir="$LAZDIR" --build-all --recursive --build-mode=Release --widgetset=${{ matrix.widgetset }} \
            --no-write-project TeroSubtitler/src/tero.lpi
          strip TeroSubtitler/bin/tero

      - name: Package
        run: |
          set -euo pipefail
          out="dist/$NAME"
          mkdir -p "$out"
          cd TeroSubtitler/bin
          cp -r CustomFormat Dictionaries Languages OCR Shortcuts "../../$out/"
          cp tero tero.cfs "../../$out/"
          cd ../..
          file "$out/tero"
          # Hunspell: the one in bin is x86_64; on ARM64 the Ubuntu library, with
          # the name Tero loads
          if [[ "${{ matrix.arch }}" == aarch64 ]]; then
            cp -L /usr/lib/aarch64-linux-gnu/libhunspell-1.7.so.0 "$out/libhunspellx64.so"
          else
            cp TeroSubtitler/bin/libhunspellx64.so "$out/"
          fi
          file "$out/libhunspellx64.so"
          # Ship the Qt bindings next to tero and let it find them there
          if [[ "${{ matrix.widgetset }}" == qt* ]]; then
            lib=$(ldd "$out/tero" | awk '/libQt[56]Pas/ {print $3}')
            [[ -n "$lib" ]] || { echo "libQtPas not linked"; ldd "$out/tero"; exit 1; }
            cp -L "$lib" "$out/"
            patchelf --set-rpath '$ORIGIN' "$out/tero"
          fi
          chmod +x "$out/tero"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.widgetset }}
          path: dist/*.tar.gz
          retention-days: 7

  build-macos:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120  # the full build (LCL + packages) takes ~45 min here
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            mode: macOS_Release
            bin: tero-intel
            ldclassic: false
          # macos-15 still ships Xcode 16, whose ld_classic Xcode 26 removed
          - os: macos-15
            mode: macOS_arm64_Release
            bin: tero-silicon
            ldclassic: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure GitHub HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --remote --recursive use/UW_BlurayPGSParser
          git submodule update --init --remote --recursive use/UW_MPVPlayer

      # Official FPC package; the Homebrew lazarus cask is disabled, so build lazbuild from source
      # SourceForge downloads are kept in the Actions cache, so a version is fetched once
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dl
          key: dl-${{ env.FPC_MACOS_URL }}

      - name: Install Lazarus
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl"
          dmg="$RUNNER_TEMP/dl/fpc.dmg"
          [[ -f "$dmg" ]] || curl -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o "$dmg" "$FPC_MACOS_URL" || { rm -f "$dmg"; exit 1; }
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | grep -o '/Volumes/.*' | tail -1)
          pkg=$(find "$mnt" -maxdepth 2 -name '*.pkg' | head -1)
          sudo installer -pkg "$pkg" -target /
          hdiutil detach "$mnt"
          export PATH="/usr/local/bin:$PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          fpc -iV
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o "$RUNNER_TEMP/lazarus.tar.gz" \
            "https://gitlab.com/freepascal.org/lazarus/lazarus/-/archive/$LAZARUS_SOURCE_TAG/lazarus-$LAZARUS_SOURCE_TAG.tar.gz"
          mkdir -p "$HOME/lazarus"
          tar -xzf "$RUNNER_TEMP/lazarus.tar.gz" -C "$HOME/lazarus" --strip-components=1
          make -C "$HOME/lazarus" lazbuild
          echo "$HOME/lazarus" >> "$GITHUB_PATH"

      # Same dependencies as make.pas, but without its OpenSSL requirement
      - name: Install packages
        shell: bash
        run: |
          set -euo pipefail
          opm="$HOME/.lazarus/onlinepackagemanager/packages"
          for p in BGRABitmap FPSpreadsheet ATFlatControls EncConv ATSynEdit; do
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o "$RUNNER_TEMP/$p.zip" "https://packages.lazarus-ide.org/$p.zip"
            mkdir -p "$opm/$p"
            unzip -q -o "$RUNNER_TEMP/$p.zip" -d "$opm/$p" -x "*/test_files/*"
          done
          find "$opm" use TeroSubtitler/common TeroSubtitler/subtitleapi TeroSubtitler/controls \
            -name '*.lpk' | grep -Ev '(gdi|x11|_template)' | while read -r lpk; do
              lazbuild --lazarusdir=$HOME/lazarus --add-package-link "$lpk"
          done

      # FPC 3.2.2 Objective-C objects break the new Apple linker on arm64 (may no longer be needed with 3.2.4)
      # ("malformed method list atom"), so link with ld_classic there
      - name: Use classic linker
        if: matrix.ldclassic
        shell: bash
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          [[ -n "$xcode" ]] || { echo "Xcode 16 not found:"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          ld -ld_classic -v 2>&1 | head -1 || true
          # Pass -ld_classic straight to ld through the project's linker options
          sed -i '' 's#<LinkerOptions Value="-rpath @executable_path\\..\\Frameworks"/>#<LinkerOptions Value="-rpath @executable_path\\..\\Frameworks -ld_classic"/>#' \
            TeroSubtitler/src/tero.lpi
          grep -n 'LinkerOptions' TeroSubtitler/src/tero.lpi

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # lazbuild links tero.app/Contents/MacOS/tero to the binary; git does not keep the empty folder
          mkdir -p TeroSubtitler/bin/tero.app/Contents/MacOS
          lazbuild --lazarusdir=$HOME/lazarus --build-all --recursive \
            --build-mode=${{ matrix.mode }} --widgetset=cocoa \
            --no-write-project TeroSubtitler/src/tero.lpi
          mkdir -p dist
          cp TeroSubtitler/bin/tero "dist/${{ matrix.bin }}"
          strip -x "dist/${{ matrix.bin }}" || true
          lipo -archs "dist/${{ matrix.bin }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}
          path: dist/${{ matrix.bin }}
          retention-days: 7

  package-macos:
    needs: [check, build-macos]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      # Same steps as ts1app.command (universal) and ts1legacy.command (Intel only)
      - name: Build app bundles
        shell: bash
        run: |
          set -euo pipefail
          base="${{ needs.check.outputs.base }}"
          bin=TeroSubtitler/bin
          mkdir -p dist

          # Universal: libmpv (UW_libmpv) and OpenSSL 3 + Hunspell (UW_TSLibs), the latest
          # releases (arm64 from macOS 11, x86_64 from 10.15). Legacy (10.11) keeps
          # bin/frameworks-legacy: the UW_TSLibs dylibs need 10.15.
          fw="$RUNNER_TEMP/frameworks"
          mkdir -p "$fw"
          for u in UW_libmpv/releases/latest/download/libmpv_macos.zip UW_TSLibs/releases/latest/download/tslibs_macos.zip; do
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o "$RUNNER_TEMP/$(basename "$u")" "https://github.com/URUWorks/$u"
            unzip -q -o "$RUNNER_TEMP/$(basename "$u")" '*.dylib' -d "$fw"
          done
          for f in libmpv.2.dylib libssl.3.dylib libcrypto.3.dylib libhunspellx64.dylib; do
            [[ -f "$fw/$f" ]] || { echo "$f missing"; ls "$fw"; exit 1; }
          done
          ls "$fw"

          make_app() {  # $1 = binary, $2 = frameworks folder, $3 = zip suffix
            local work="$RUNNER_TEMP/$3" app
            app="$work/Tero Subtitler.app"
            rm -rf "$work"; mkdir -p "$work"
            ditto "$bin/tero.app" "$app"
            mkdir -p "$app/Contents/MacOS"
            rm -f "$app/Contents/MacOS/tero"
            cp "$1" "$app/Contents/MacOS/tero"
            chmod +x "$app/Contents/MacOS/tero"
            echo "$3: $(lipo -archs "$app/Contents/MacOS/tero")"
            rm -rf "$app/Contents/Frameworks"
            ditto "$2" "$app/Contents/Frameworks"
            rm -rf "$app/Contents/Resources/Languages"
            ditto "$bin/Languages" "$app/Contents/Resources/Languages"
            # resources from bin too, the copies in the tero.app template are not kept in sync
            for d in Dictionaries OCR CustomFormat; do
              rm -rf "$app/Contents/Resources/$d"
              ditto "$bin/$d" "$app/Contents/Resources/$d"
            done
            find "$app" -name '.DS_Store' -delete
            xattr -cr "$app"
            codesign --force --deep --sign - "$app"
            ditto -c -k --keepParent "$app" "dist/$base-$3.zip"
          }

          lipo -create binaries/tero-intel binaries/tero-silicon -output "$RUNNER_TEMP/tero-universal"
          make_app "$RUNNER_TEMP/tero-universal" "$fw" macos-universal
          make_app binaries/tero-intel "$bin/frameworks-legacy" macos-legacy-intel

          # Installer (.pkg): both bundles inside, it installs the universal one from
          # macOS 10.15 and the Intel legacy one on 10.11-10.14, into /Applications.
          # Dictionaries are optional, one choice each, in /Library/Application Support
          # (Tero looks there first), so the signed bundles go without them.
          pkgs="$RUNNER_TEMP/pkgs"
          mkdir -p "$pkgs"
          version="${{ needs.check.outputs.version }}"
          for v in universal legacy-intel; do
            root="$RUNNER_TEMP/pkgroot-$v"
            rm -rf "$root"; mkdir -p "$root"
            ditto "$RUNNER_TEMP/macos-$v/Tero Subtitler.app" "$root/Tero Subtitler.app"
            rm -rf "$root/Tero Subtitler.app/Contents/Resources/Dictionaries"
            codesign --force --deep --sign - "$root/Tero Subtitler.app"
            pkgbuild --analyze --root "$root" "$pkgs/$v.plist"
            # always /Applications, not wherever another copy of the bundle is
            plutil -replace 0.BundleIsRelocatable -bool NO "$pkgs/$v.plist"
            pkgbuild --root "$root" --component-plist "$pkgs/$v.plist" \
              --identifier "com.uruworks.tero.$v" --version "$version" \
              --install-location /Applications "$pkgs/$v.pkg"
          done

          dics_outline=""; dics_choices=""; dics_refs=""
          for f in "$bin"/Dictionaries/*.dic; do
            name="$(basename "$f" .dic)"
            id="dic_$(echo "$name" | tr -c 'A-Za-z0-9_\n' '_')"
            root="$RUNNER_TEMP/dicroot/$id"
            mkdir -p "$root"
            cp "$bin/Dictionaries/$name.aff" "$bin/Dictionaries/$name.dic" "$root/"
            cp "$bin/Dictionaries/${name%% *}"*README*.txt "$root/" 2>/dev/null || true
            pkgbuild --root "$root" --identifier "com.uruworks.tero.$id" --version "$version" \
              --install-location "/Library/Application Support/Tero Subtitler/Dictionaries" "$pkgs/$id.pkg"
            dics_outline+="<line choice=\"$id\"/>"
            dics_choices+="<choice id=\"$id\" title=\"$name\" selected=\"isLanguage('$name')\"><pkg-ref id=\"com.uruworks.tero.$id\"/></choice>"
            dics_refs+="<pkg-ref id=\"com.uruworks.tero.$id\">$id.pkg</pkg-ref>"
          done

          cat > "$pkgs/distribution.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
            <title>Tero Subtitler</title>
            <options customize="always" require-scripts="false" hostArchitectures="x86_64,arm64"/>
            <domains enable_localSystem="true"/>
            <volume-check>
              <allowed-os-versions><os-version min="10.11"/></allowed-os-versions>
            </volume-check>
            <script><![CDATA[
              function isModern() { return system.compareVersions(system.version.ProductVersion, '10.15') >= 0; }
              // the dictionary of the system language (from LANG), en_US otherwise
              function isLanguage(name) {
                var l = (system.env.LANG || '').split('.')[0];
                if (l == 'pt_PT') return name.indexOf('pt_PT (pos-AO') == 0;
                if (l == 'en_GB') return name == 'en_GB';
                var def = { bg: 'bg_BG', en: 'en_US', es: 'es_UY', it: 'it_IT', ko: 'ko_KR', pt: 'pt_BR', ru: 'ru_RU' };
                return name == (def[l.split('_')[0]] || 'en_US');
              }
            ]]></script>
            <choices-outline>
              <line choice="universal"/>
              <line choice="legacy"/>
              <line choice="dictionaries">$dics_outline</line>
            </choices-outline>
            <choice id="universal" visible="false" selected="isModern()" enabled="isModern()">
              <pkg-ref id="com.uruworks.tero.universal"/>
            </choice>
            <choice id="legacy" visible="false" selected="!isModern()" enabled="!isModern()">
              <pkg-ref id="com.uruworks.tero.legacy-intel"/>
            </choice>
            <choice id="dictionaries" title="Spell checking dictionaries"/>
            $dics_choices
            <pkg-ref id="com.uruworks.tero.universal">universal.pkg</pkg-ref>
            <pkg-ref id="com.uruworks.tero.legacy-intel">legacy-intel.pkg</pkg-ref>
            $dics_refs
          </installer-gui-script>
          EOF
          xmllint --noout "$pkgs/distribution.xml"
          productbuild --distribution "$pkgs/distribution.xml" --package-path "$pkgs" "dist/$base-macos.pkg"

          # the .pkg must install the universal bundle here (macOS 14 or later), and en_US
          sudo installer -pkg "dist/$base-macos.pkg" -target /
          app="/Applications/Tero Subtitler.app"
          archs="$(lipo -archs "$app/Contents/MacOS/tero")"
          echo "installed: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "the .pkg did not install the universal bundle"; exit 1; }
          for f in libmpv.2.dylib libssl.3.dylib libcrypto.3.dylib libhunspellx64.dylib; do
            [[ -f "$app/Contents/Frameworks/$f" ]] || { echo "$f missing in the installed bundle"; exit 1; }
          done
          ls -l "/Library/Application Support/Tero Subtitler/Dictionaries"
          [[ -f "/Library/Application Support/Tero Subtitler/Dictionaries/en_US.dic" ]] || { echo "en_US dictionary missing"; exit 1; }
          codesign --verify --deep "$app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.pkg
          retention-days: 7

  release:
    needs: [check, build, build-linux, package-macos]
    # only main publishes the nightly (a manual run on a branch just builds)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          Nightly builds are automatically generated every day and contain the latest development changes. They are intended for testing new features, verifying bug fixes, identifying regressions, and helping track down bugs. They also provide an early preview of what may be included in a future stable release.

          **Please note:** Nightly builds are experimental and may contain bugs or unstable features. They are not recommended for everyday use.
          EOF
          echo -e "\nVersion ${{ needs.check.outputs.version }}, built from commit [${GITHUB_SHA::7}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})." >> notes.md
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/*.zip dist/*.tar.gz dist/*.pkg \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Nightly build ${{ needs.check.outputs.version }} ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
            --notes-file notes.md

  # the ARM64 zip, added to the nightly when it is built and tested
  release-winarm64:
    needs: [release, test-winarm64]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winarm64
          path: dist

      - name: Add to the nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload nightly dist/*.zip --clobber

  # Windows web installer (TeroSubtitler/make_installer.ps1): tero.exe and its data inside;
  # libmpv, OpenSSL 3, Hunspell and the chosen dictionaries are downloaded when installing,
  # for the Windows it runs on (x64, ARM64 or 7/8.1), each checked by its SHA-256
  installer:
    needs: [check, build, test-winarm64]
    # with or without ARM64 (experimental)
    if: always() && needs.build.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ needs.check.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: win64
          path: artifacts/win64

      - name: Download Windows ARM64 build
        if: needs.test-winarm64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: winarm64
          path: artifacts/winarm64

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          curl.exe -fsSL --retry 8 --retry-all-errors --retry-delay 10 --speed-limit 10000 --speed-time 60 -C - -o $exe $env:INNOSETUP_URL
          if ($LastExitCode -ne 0) { exit $LastExitCode }
          Start-Process -FilePath $exe -ArgumentList '/SP-','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$env:RUNNER_TEMP\InnoSetup" -Wait -NoNewWindow
          "$env:RUNNER_TEMP\InnoSetup" >> $env:GITHUB_PATH

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          Expand-Archive "artifacts/win64/$env:BASE-win64.zip" -DestinationPath x64
          $opts = @{ Bin = "x64/$env:BASE-win64" }
          if (Test-Path artifacts/winarm64) {
            Expand-Archive "artifacts/winarm64/$env:BASE-winarm64.zip" -DestinationPath arm64
            $opts.Arm64Bin = "arm64/$env:BASE-winarm64"
          }
          ./TeroSubtitler/make_installer.ps1 @opts -Web `
            -DicBaseUrl "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/TeroSubtitler/bin/Dictionaries/" `
            -AppVersion "${{ needs.check.outputs.version }} nightly" `
            -OutputName "$env:BASE-win-setup" -OutputDir dist

      # silent install on Windows x64: downloads, checks and installs everything
      - name: Test installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          $dir = "$env:RUNNER_TEMP\Tero"
          $log = "$env:RUNNER_TEMP\setup.log"
          $p = Start-Process (Get-ChildItem dist/*.exe).FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir","/LOG=$log" -Wait -PassThru
          Get-Content $log -Tail 30
          if ($p.ExitCode -ne 0) { Write-Error "setup exited with code $($p.ExitCode)" }
          foreach ($f in 'tero.exe','libmpv-2.dll','libssl-3-x64.dll','libcrypto-3-x64.dll','libhunspellx64.dll','Dictionaries\en_US.dic','Dictionaries\en_US.aff','Languages\tero.es_UY.po') {
            if (-not (Test-Path "$dir\$f")) { Write-Error "$f missing" }
          }
          $t = Start-Process "$dir\tero.exe" -PassThru
          Start-Sleep 20
          if ($t.HasExited) { Write-Error "tero.exe exited with code $($t.ExitCode)" }
          Stop-Process $t
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe
          retention-days: 7

  # the same installer on a real ARM64 Windows: it must pick the ARM64 build
  test-installer-winarm64:
    needs: [installer, test-winarm64]
    if: always() && needs.installer.result == 'success' && needs.test-winarm64.result == 'success'
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer

      - name: Install and start
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          $dir = "$env:RUNNER_TEMP\Tero"
          $log = "$env:RUNNER_TEMP\setup.log"
          $p = Start-Process (Get-ChildItem *.exe).FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir","/LOG=$log" -Wait -PassThru
          Get-Content $log -Tail 30
          if ($p.ExitCode -ne 0) { Write-Error "setup exited with code $($p.ExitCode)" }
          foreach ($f in 'libmpv-2.dll','libssl-3-arm64.dll','libcrypto-3-arm64.dll','libhunspellx64.dll','Dictionaries\en_US.dic') {
            if (-not (Test-Path "$dir\$f")) { Write-Error "$f missing" }
          }
          # PE machine type of the installed tero.exe must be ARM64 (0xAA64)
          $b = [IO.File]::ReadAllBytes("$dir\tero.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          if ([BitConverter]::ToUInt16($b, $pe + 4) -ne 0xAA64) { Write-Error 'the installed tero.exe is not ARM64' }
          $t = Start-Process "$dir\tero.exe" -PassThru
          Start-Sleep 20
          if ($t.HasExited) { Write-Error "tero.exe exited with code $($t.ExitCode)" }
          Stop-Process $t

  # the installer, added to the nightly (not if it failed on ARM64)
  release-installer:
    needs: [release, installer, test-installer-winarm64]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.release.result == 'success' && needs.installer.result == 'success' &&
      needs.test-installer-winarm64.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist

      - name: Add to the nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload nightly dist/*.exe --clobber
