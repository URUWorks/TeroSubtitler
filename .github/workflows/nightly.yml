---
name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Compare HEAD with current nightly tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha=$(gh api "repos/${{ github.repository }}/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$tag_sha" != "${{ github.sha }}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win64
          - os: ubuntu-latest
            name: linux-x86_64-gtk2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure GitHub HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --remote --recursive use/UW_BlurayPGSParser
          git submodule update --init --remote --recursive use/UW_MPVPlayer

      - name: Set nightly version
        id: ver
        shell: bash
        run: echo "name=TeroSubtitler-$(cat version.txt | tr -d '[:space:]')-nightly-$(date -u +%Y%m%d)-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # Install Lazarus and the packages via the existing Make scripts,
      # then rebuild tero in Release mode.
      - name: Build on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source '.github/workflows/make.sh'
          # ATSynEdit needs the LCL gtk2 interface built with WITH_GTK2_IM.
          # Ubuntu's lazbuild has no --opt, so set the define globally and
          # let the recursive build recompile LCL.
          echo '-dWITH_GTK2_IM' | sudo tee -a /etc/fpc.cfg
          sudo chown -R "$USER" /usr/lib/lazarus
          lazbuild --build-all --recursive --build-mode=Release --widgetset=gtk2 \
            --no-write-project TeroSubtitler/src/tero.lpi
          strip TeroSubtitler/bin/tero

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -File '.github/workflows/make.ps1'
          if ($LastExitCode -ne 0) { exit $LastExitCode }
          $env:PATH += ';C:\Lazarus;C:\Lazarus\fpc\3.2.2\bin\x86_64-win64'
          lazbuild --build-all --build-mode=Release --no-write-project TeroSubtitler/src/tero.lpi
          if ($LastExitCode -ne 0) { exit $LastExitCode }

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out="dist/${{ steps.ver.outputs.name }}"
          mkdir -p "$out"
          cd TeroSubtitler/bin
          cp -r CustomFormat Dictionaries Languages OCR "../../$out/"
          cp -r Shortcuts "../../$out/"
          cp libhunspellx64.so tero tero.cfs "../../$out/"
          chmod +x "../../$out/tero"
          cd ../../dist
          tar -czf "${{ steps.ver.outputs.name }}.tar.gz" "${{ steps.ver.outputs.name }}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/${{ steps.ver.outputs.name }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bin = 'TeroSubtitler/bin'
          foreach ($d in 'CustomFormat','Dictionaries','Icons','Languages','OCR') {
            Copy-Item -Recurse "$bin/$d" "$out/$d"
          }
          Copy-Item -Recurse "$bin/Shortcuts" "$out/Shortcuts"
          foreach ($f in 'libcrypto-1_1-x64.dll','libhunspellx64.dll','libmpv-2.dll','libssl-1_1-x64.dll','tero.cfs','tero.exe') {
            Copy-Item "$bin/$f" "$out/$f"
          }
          Compress-Archive -Path $out -DestinationPath "dist/${{ steps.ver.outputs.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          retention-days: 7

  build-macos:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            mode: macOS_Release
            bin: tero-intel
          - os: macos-latest
            mode: macOS_arm64_Release
            bin: tero-silicon

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure GitHub HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --remote --recursive use/UW_BlurayPGSParser
          git submodule update --init --remote --recursive use/UW_MPVPlayer

      # The Homebrew lazarus cask is disabled, so build lazbuild from source
      - name: Install Lazarus
        run: |
          brew install fpc
          curl -fsSL -o "$RUNNER_TEMP/lazarus.tar.gz" \
            "https://gitlab.com/freepascal.org/lazarus/lazarus/-/archive/lazarus_4_8/lazarus-lazarus_4_8.tar.gz"
          mkdir -p "$HOME/lazarus"
          tar -xzf "$RUNNER_TEMP/lazarus.tar.gz" -C "$HOME/lazarus" --strip-components=1
          make -C "$HOME/lazarus" lazbuild
          echo "$HOME/lazarus" >> "$GITHUB_PATH"

      # Same dependencies as make.pas, but without its OpenSSL requirement
      - name: Install packages
        shell: bash
        run: |
          set -euo pipefail
          opm="$HOME/.lazarus/onlinepackagemanager/packages"
          for p in BGRABitmap FPSpreadsheet ATFlatControls EncConv ATSynEdit; do
            curl -fsSL -o "$RUNNER_TEMP/$p.zip" "https://packages.lazarus-ide.org/$p.zip"
            mkdir -p "$opm/$p"
            unzip -q -o "$RUNNER_TEMP/$p.zip" -d "$opm/$p"
          done
          find "$opm" use TeroSubtitler/common TeroSubtitler/subtitleapi TeroSubtitler/controls \
            -name '*.lpk' | grep -Ev '(gdi|x11|_template)' | while read -r lpk; do
              lazbuild --lazarusdir=$HOME/lazarus --add-package-link "$lpk"
          done

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          lazbuild --lazarusdir=$HOME/lazarus --build-all --recursive \
            --build-mode=${{ matrix.mode }} --widgetset=cocoa \
            --no-write-project TeroSubtitler/src/tero.lpi
          mkdir -p dist
          cp TeroSubtitler/bin/tero "dist/${{ matrix.bin }}"
          strip -x "dist/${{ matrix.bin }}" || true
          lipo -archs "dist/${{ matrix.bin }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}
          path: dist/${{ matrix.bin }}
          retention-days: 7

  package-macos:
    needs: build-macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      # Same steps as ts1app.command (universal) and ts1legacy.command (Intel only)
      - name: Build app bundles
        shell: bash
        run: |
          set -euo pipefail
          base="TeroSubtitler-$(tr -d '[:space:]' < version.txt)-nightly-$(date -u +%Y%m%d)"
          bin=TeroSubtitler/bin
          mkdir -p dist

          make_app() {  # $1 = binary, $2 = frameworks folder, $3 = zip suffix
            local work="$RUNNER_TEMP/$3" app
            app="$work/Tero Subtitler.app"
            rm -rf "$work"; mkdir -p "$work"
            ditto "$bin/tero.app" "$app"
            mkdir -p "$app/Contents/MacOS"
            rm -f "$app/Contents/MacOS/tero"
            cp "$1" "$app/Contents/MacOS/tero"
            chmod +x "$app/Contents/MacOS/tero"
            echo "$3: $(lipo -archs "$app/Contents/MacOS/tero")"
            rm -rf "$app/Contents/Frameworks"
            ditto "$bin/$2" "$app/Contents/Frameworks"
            rm -rf "$app/Contents/Resources/Languages"
            ditto "$bin/Languages" "$app/Contents/Resources/Languages"
            find "$app" -name '.DS_Store' -delete
            xattr -cr "$app"
            codesign --force --deep --sign - "$app"
            ditto -c -k --keepParent "$app" "dist/$base-$3.zip"
          }

          lipo -create binaries/tero-intel binaries/tero-silicon -output "$RUNNER_TEMP/tero-universal"
          make_app "$RUNNER_TEMP/tero-universal" frameworks macos-universal
          make_app binaries/tero-intel frameworks-legacy macos-legacy-intel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          retention-days: 7

  release:
    needs: [build, package-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          Nightly builds are automatically generated every day and contain the latest development changes. They are intended for testing new features, verifying bug fixes, identifying regressions, and helping track down bugs. They also provide an early preview of what may be included in a future stable release.

          **Please note:** Nightly builds are experimental and may contain bugs or unstable features. They are not recommended for everyday use.
          EOF
          echo -e "\nBuilt from commit ${{ github.sha }}." >> notes.md
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/*.zip dist/*.tar.gz \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Nightly build $(date -u +%Y-%m-%d)" \
            --notes-file notes.md
