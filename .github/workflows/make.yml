---
name: Make

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure GitHub HTTPS
        run: 
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --remote --recursive use/UW_BlurayPGSParser
          git submodule update --init --remote --recursive use/UW_MPVPlayer
          
      - name: Build on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: source '.github/workflows/make.sh'

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: pwsh -File '.github/workflows/make.ps1'
